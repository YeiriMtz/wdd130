<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="\Splash White Water Rafting - Home Page.">
    <title>Splash White Water Rafting - Home Page</title>
    <link rel="stylesheet" href="rafting.css">
    <!-- typography 1 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- typography 2 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background">
        <header>
            <nav class="navigation">
                <img src="images/z-splash.png" alt="Splash Logo">
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="trips.html">Trips</a>
                <a href="contact.html">Contact Us</a>
            </nav>
        </header>

        <main>
            <section class="hero">
                <h1>Have An Adventure With Us</h1>
            </section>

                <form>
                    <fieldset>
                        <legend class="home-form-legend">Join Us!</legend>
                        <!-- name -->
                            <label for="first-name">Name</label>
                            <input type="text" name="first-name" id="first-name" placeholder="Your Name Here">
                        <!-- email address -->
                            <label for="email">Email</label>
                            <input type="text" name="email" id="email" placeholder="example@email.com">
                    </fieldset>
                    <a href="trips.html" class="newsletter-button">Book Now</a>
                </form>

                <section class="adventure-section">
                    <div class="adventure-gallery">
                        <figure>
                            <img src="images/rivers-home.jpg" alt="1">
                            <figcaption>Rivers</figcaption>
                        </figure>
                        <figure>
                            <img src="images/camping-home.jpg" alt="2">
                            <figcaption>Camping</figcaption>
                        </figure>
                        <figure>
                            <img src="images/rapids-home.jpg" alt="3">
                            <figcaption>Rapids</figcaption>
                        </figure>
                    </div>
                </section>
        </main>
    </div>

    <footer>
        <div class="footer-container">
            <p>Splash White Water Rafting ©️ 2025 - Yeiri Martinez</p>

            <nav class="socialinks">
                <a href="https://www.facebook.com/">
                    <img src="images/facebook.png" alt="Facebook">
                </a>
                <a href="https://www.tiktok.com/@yeirimartinez">
                    <img src="images/tiktok.png" alt="TikTok">
                </a>
                <a href="https://www.instagram.com/">
                    <img src="images/instagram.png" alt="Instagram">
                </a>
            </nav>
        </div>  
    </footer>

</body>
</html>
